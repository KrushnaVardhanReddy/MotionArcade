[workspace]
members = [
    "crates/core",
    "crates/learning",
    "crates/games/deflecto_bot",
    "crates/app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["MotionArcade Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
macroquad = "0.4"
toml = "0.8"
csv = "1.3"
clap = { version = "4.4", features = ["derive"] }
